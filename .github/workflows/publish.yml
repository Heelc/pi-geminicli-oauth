name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  # OIDC trusted publishing 必需，缺这一项 npm publish 会退回到找 token 并失败
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # trusted publishing 要求 Node >= 22.14 且 npm >= 11.5.1，Node 24 自带的 npm 满足
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # 官方建议 release 构建不使用缓存，避免缓存投毒
          package-manager-cache: false

      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG 与 package.json 版本 $PKG 不一致，拒绝发布" >&2
            exit 1
          fi
          echo "版本一致：$PKG"

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # 无需 NODE_AUTH_TOKEN：凭 OIDC 认证，并自动生成 provenance
      - run: npm publish
